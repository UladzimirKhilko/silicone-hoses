{% load static %}<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Патрубки BSI{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'catalog:product_list' %}">Патрубки BSI</a>
    {% if user.is_authenticated %}
    <nav>
      <a href="{% url 'catalog:product_list' %}">Остатки</a>
      <a href="{% url 'stock:batch_list' %}">Приходы</a>
      <a href="{% url 'stock:shipment_list' %}">Отгрузки</a>
      <a href="{% url 'stock:adjustment_list' %}">Списания</a>
      {% if user.is_staff %}<a href="{% url 'admin:index' %}">Админка</a>{% endif %}
      <form method="post" action="{% url 'logout' %}" class="inline">{% csrf_token %}<button class="link">Выйти ({{ user.get_short_name|default:user.username }})</button></form>
    </nav>
    {% endif %}
  </header>
  <main>
    {% for m in messages %}<div class="msg msg-{{ m.tags }}">{{ m }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
