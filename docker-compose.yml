services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hoses
      POSTGRES_USER: hoses
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - db:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    depends_on: [db]
    env_file: .env
    environment:
      POSTGRES_DB: hoses
      POSTGRES_USER: hoses
      POSTGRES_HOST: db
    volumes:
      - media:/data/media
      - source:/data/source

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

volumes:
  db:
  media:
  source:
  caddy:
